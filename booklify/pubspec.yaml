name: booklify
description: "Booklify - A gamified reading app that makes reading feel like tending a living garden"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # AI
  openai_dart: ^4.3.0

  # Storage
  sqflite: ^2.3.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1

  # UI & Animations
  flutter_svg: ^2.0.9
  lottie: ^3.0.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # Navigation
  go_router: ^17.2.2

  # Audio & Voice
  flutter_tts: ^4.2.5
  speech_to_text: ^7.3.0
  just_audio: ^0.10.5

  # File import
  file_picker: ^11.0.2
  archive: ^4.0.9
  syncfusion_flutter_pdf: ^33.2.3

  # HTTP & API
  dio: ^5.4.0

  # Utilities
  uuid: ^4.3.1
  intl: ^0.20.0
  freezed_annotation: ^3.1.0
  flutter_dotenv: ^6.0.1
  crypto: ^3.0.3
  path: ^1.8.3

  # JSON Serialization
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.7
  riverpod_generator: ^4.0.0+1
  freezed: ^3.2.3
  json_serializable: ^6.7.1

  # Linting
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/.env
